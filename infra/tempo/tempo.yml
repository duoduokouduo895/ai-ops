target: all

server:
  http_listen_port: 3200
  grpc_listen_port: 9095

memory:
  automemlimit_enabled: true
  automemlimit_ratio: 0.8

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 72h

usage_report:
  reporting_enabled: false
