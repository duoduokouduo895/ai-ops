spring:
  application:
    name: aidiag
  ai:
    # Keep provider auto-configuration off unless Stage 4 is explicitly enabled
    # in a reviewed cloud release. The API key comes from a config-tree secret.
    model:
      chat: ${AIDIAG_STAGE4_CHAT_MODEL:none}
    retry:
      max-attempts: 1
    openai:
      base-url: ${AIDIAG_DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${AIDIAG_DEEPSEEK_API_KEY:${aidiag.deepseek.api-key:}}
      chat:
        model: ${AIDIAG_DEEPSEEK_MODEL:deepseek-v4-flash}
  config:
    import: optional:configtree:/run/secrets/
  datasource:
    url: ${AIDIAG_DB_URL:jdbc:postgresql://localhost:5432/aidiag}
    username: ${AIDIAG_DB_USERNAME:aidiag}
    password: ${AIDIAG_DB_PASSWORD:${aidiag.db.password:}}
    hikari:
      maximum-pool-size: ${AIDIAG_DB_POOL_MAX:10}
      minimum-idle: ${AIDIAG_DB_POOL_MIN:2}
      connection-timeout: 5000
      validation-timeout: 3000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${DEPLOYMENT_ENVIRONMENT:local}

springdoc:
  api-docs:
    enabled: ${AIDIAG_OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${AIDIAG_OPENAPI_ENABLED:true}

logging:
  file:
    name: ${AIDIAG_LOG_FILE:}
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 3
      total-size-cap: 500MB
  structured:
    format:
      console: logstash
      file: logstash

info:
  app:
    name: ${spring.application.name}
    version: "@project.version@"

aidiag:
  smoke:
    enabled: ${AIDIAG_SMOKE_ENABLED:false}
  alerts:
    webhook:
      username: ${AIDIAG_ALERT_WEBHOOK_USERNAME:alertmanager}
      password: ${AIDIAG_ALERT_WEBHOOK_PASSWORD:${aidiag.alerts.webhook.password:}}
      max-payload-bytes: ${AIDIAG_ALERT_WEBHOOK_MAX_PAYLOAD_BYTES:262144}
  worker:
    enabled: ${AIDIAG_WORKER_ENABLED:true}
    poll-delay-ms: ${AIDIAG_WORKER_POLL_DELAY_MS:1000}
    lease-seconds: ${AIDIAG_WORKER_LEASE_SECONDS:30}
    heartbeat-seconds: ${AIDIAG_WORKER_HEARTBEAT_SECONDS:5}
    processing-delay-ms: ${AIDIAG_WORKER_PROCESSING_DELAY_MS:0}
    max-attempts: ${AIDIAG_WORKER_MAX_ATTEMPTS:3}
    retry-backoff-seconds: ${AIDIAG_WORKER_RETRY_BACKOFF_SECONDS:5}
  stage3:
    enabled: ${AIDIAG_STAGE3_ENABLED:false}
    poll-delay-ms: ${AIDIAG_STAGE3_POLL_DELAY_MS:1000}
    lease-seconds: ${AIDIAG_STAGE3_LEASE_SECONDS:30}
    initial-delay-seconds: ${AIDIAG_STAGE3_INITIAL_DELAY_SECONDS:30}
    prometheus-base-url: ${AIDIAG_PROMETHEUS_BASE_URL:http://prometheus:9090}
    loki-base-url: ${AIDIAG_LOKI_BASE_URL:http://loki:3100}
    tempo-base-url: ${AIDIAG_TEMPO_BASE_URL:http://tempo:3200}
    tool-timeout-seconds: ${AIDIAG_STAGE3_TOOL_TIMEOUT_SECONDS:8}
  stage4:
    enabled: ${AIDIAG_STAGE4_ENABLED:false}
    prompt-version: ${AIDIAG_STAGE4_PROMPT_VERSION:stage4-v1}
    max-evidence: ${AIDIAG_STAGE4_MAX_EVIDENCE:12}
    timeout-seconds: ${AIDIAG_STAGE4_TIMEOUT_SECONDS:12}
    daily-request-limit: ${AIDIAG_STAGE4_DAILY_REQUEST_LIMIT:20}
    max-prompt-chars: ${AIDIAG_STAGE4_MAX_PROMPT_CHARS:16000}
    max-output-tokens: ${AIDIAG_STAGE4_MAX_OUTPUT_TOKENS:1200}
    retention-days: ${AIDIAG_STAGE4_RETENTION_DAYS:30}
    operator:
      username: ${AIDIAG_STAGE4_OPERATOR_USERNAME:aidiag-operator}
      password: ${AIDIAG_STAGE4_OPERATOR_PASSWORD:${aidiag.stage4.operator.secret:}}
