global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: cloud-demo

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: aidiag
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [aidiag-backend:8080]
        labels:
          service_name: aidiag

  - job_name: ai-chat-candidate
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ai-chat-candidate:9091]
        labels:
          service_name: ai-chat-candidate

  # Production targets are intentionally absent from Git. The reviewed
  # activation script writes the file_sd document immediately before the
  # production process starts, so an unstarted service cannot create false
  # incidents during Phase B.
  - job_name: ai-chat-production
    metrics_path: /actuator/prometheus
    file_sd_configs:
      - files: [/etc/prometheus/targets/ai-chat-production.json]
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [scrape_kind]
        regex: metrics
        action: keep
      - regex: scrape_kind
        action: labeldrop

  # Runs outside the AI-chat JVM, so it remains useful when the application
  # cannot start. The component label is fixed here and never user-controlled.
  - job_name: blackbox-ai-chat
    metrics_path: /probe
    static_configs:
      - targets: [http://ai-chat-candidate:9091/actuator/health]
        labels: {module: http_health, component: application, target_kind: application, service_name: ai-chat-candidate}
      - targets: [mysql:3306]
        labels: {module: tcp_connect, component: mysql, target_kind: dependency, service_name: ai-chat-candidate}
      - targets: [redis:6379]
        labels: {module: tcp_connect, component: redis, target_kind: dependency, service_name: ai-chat-candidate}
      - targets: [rabbitmq:5672]
        labels: {module: tcp_connect, component: rabbitmq, target_kind: dependency, service_name: ai-chat-candidate}
      - targets: [elasticsearch-v9-candidate:9200]
        labels: {module: tcp_connect, component: elasticsearch, target_kind: dependency, service_name: ai-chat-candidate}
      - targets: [nacos-v3-candidate:8848]
        labels: {module: tcp_connect, component: nacos, target_kind: dependency, service_name: ai-chat-candidate}
    file_sd_configs:
      - files: [/etc/prometheus/targets/ai-chat-production.json]
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [scrape_kind]
        # Static candidate targets have no scrape_kind; production file_sd
        # targets must explicitly identify themselves as probes.
        regex: probe|
        action: keep
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [module]
        target_label: __param_module
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - regex: scrape_kind
        action: labeldrop

  - job_name: ai-chat-stage5-lab
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ai-chat-stage5-lab:8080]
        labels:
          service_name: ai-chat-stage5-lab

  - job_name: faultlab-order
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [order-service:8080]
        labels:
          service_name: order-service

  - job_name: faultlab-payment
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [payment-service:8080]
        labels:
          service_name: payment-service

  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
