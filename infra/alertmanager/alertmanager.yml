global:
  resolve_timeout: 5m

route:
  receiver: aidiag-webhook
  group_by: [alertname, service_name, environment]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: aidiag-webhook
    webhook_configs:
      - url: http://aidiag-backend:8080/api/v1/alerts/alertmanager
        send_resolved: true
        max_alerts: 20
        timeout: 10s
        http_config:
          basic_auth:
            username: alertmanager
            password_file: /run/secrets/alertmanager_webhook_password

