groups:
  - name: aidiag-platform
    rules:
      - alert: AIDiagBackendDown
        expr: up{job="aidiag"} == 0
        for: 1m
        labels:
          severity: critical
          service_name: aidiag
        annotations:
          summary: AIDiag backend is unavailable
          description: Prometheus has failed to scrape AIDiag for more than one minute.

      - alert: AIDiagHighJvmHeapUsage
        expr: |
          (
            sum by (service_name) (jvm_memory_used_bytes{job="aidiag",area="heap"})
            /
            sum by (service_name) (jvm_memory_max_bytes{job="aidiag",area="heap"} > 0)
          ) > 0.85
        for: 5m
        labels:
          severity: warning
          service_name: aidiag
        annotations:
          summary: AIDiag JVM heap usage is high
          description: JVM heap usage has remained above 85 percent for five minutes.

      - alert: FaultLabThreadPoolRejected
        expr: faultlab_thread_pool_saturated{service_name="payment-service"} == 1
        for: 15s
        labels:
          severity: warning
          service_name: payment-service
        annotations:
          summary: Fault Lab payment worker pool is saturated
          description: The controlled Fault Lab worker pool has two active workers and a full queue.

      - alert: FaultLabHikariPoolExhausted
        expr: faultlab_hikari_holders_active >= 4
        for: 15s
        labels:
          severity: warning
          service_name: payment-service
        annotations:
          summary: Fault Lab payment connection pool is exhausted
          description: All four controlled Fault Lab Hikari connections are held.

      # These two rules are deliberately limited to the isolated Fault Lab. The
      # faultlab_fault_active metric represents a fixed, authenticated test control
      # state; it must never be reused as a production service-health signal.
      - alert: FaultLabDownstreamTimeout
        expr: faultlab_fault_active{service_name="payment-service",fault="downstream-timeout"} == 1
        for: 15s
        labels:
          severity: warning
          service_name: payment-service
        annotations:
          summary: Fault Lab controlled downstream timeout is active
          description: The controlled Payment downstream delay is active; trigger an Order request to collect its log and trace evidence.

      - alert: FaultLabDatabaseSlowQuery
        expr: faultlab_fault_active{service_name="payment-service",fault="database-slow-query"} == 1
        for: 15s
        labels:
          severity: warning
          service_name: payment-service
        annotations:
          summary: Fault Lab controlled database slow query is active
          description: The controlled Payment database slow-query fault is active; trigger an Order request to collect its log and trace evidence.

  - name: ai-chat-candidate
    rules:
      # These alerts use bounded-cardinality metrics emitted by the private Stage 5
      # candidate. They do not contain user, conversation, prompt or URL labels.
      - alert: AiChatModelTimeout
        expr: increase(aichat_chat_requests_total{service_name="ai-chat-candidate",outcome="timeout"}[5m]) >= 1
        for: 30s
        labels:
          severity: warning
          service_name: ai-chat-candidate
        annotations:
          summary: AI-chat model stream timed out
          description: At least one candidate chat stream ended with the bounded timeout outcome in five minutes.

      - alert: AiChatR2dbcPoolExhaustion
        expr: max_over_time(aichat_r2dbc_pool_pending{service_name="ai-chat-candidate"}[5m]) >= 1
        for: 1m
        labels:
          severity: warning
          service_name: ai-chat-candidate
        annotations:
          summary: AI-chat R2DBC acquisition is pending
          description: Candidate database connection acquisition has remained queued; correlate with the fixed timeout event before confirming exhaustion.

      - alert: AiChatDocumentBacklog
        expr: max_over_time(aichat_document_outbox_pending{service_name="ai-chat-candidate"}[10m]) >= 10
        for: 2m
        labels:
          severity: warning
          service_name: ai-chat-candidate
        annotations:
          summary: AI-chat document outbox backlog is elevated
          description: At least ten unpublished document outbox events remain pending; correlate with retry events before confirming the pipeline root cause.

      - alert: AiChatSearchUnavailable
        expr: increase(aichat_search_requests_total{service_name="ai-chat-candidate",outcome="error"}[5m]) >= 3
        for: 1m
        labels:
          severity: warning
          service_name: ai-chat-candidate
        annotations:
          summary: AI-chat knowledge search is repeatedly failing
          description: At least three candidate search operations failed in five minutes; correlate with the fixed Elasticsearch operation event.

  # Stage 5.3 lifecycle is driven only by authenticated state in the isolated
  # contract lab. Diagnosis still evaluates production-compatible telemetry.
  - name: ai-chat-stage5-lab
    rules:
      - alert: AiChatModelTimeout
        expr: aichat_stage5_fault_active{service_name="ai-chat-stage5-lab",fault="model-timeout"} == 1
        for: 15s
        labels: {severity: warning, service_name: ai-chat-stage5-lab}
        annotations:
          summary: Isolated AI-chat model timeout contract is active
          description: Stage 5.3 authenticated contract state; never a production health signal.

      - alert: AiChatR2dbcPoolExhaustion
        expr: aichat_stage5_fault_active{service_name="ai-chat-stage5-lab",fault="r2dbc-pool-exhaustion"} == 1
        for: 15s
        labels: {severity: warning, service_name: ai-chat-stage5-lab}
        annotations:
          summary: Isolated AI-chat R2DBC pool contract is active
          description: Stage 5.3 authenticated contract state; never a production health signal.

      - alert: AiChatDocumentBacklog
        expr: aichat_stage5_fault_active{service_name="ai-chat-stage5-lab",fault="document-backlog"} == 1
        for: 15s
        labels: {severity: warning, service_name: ai-chat-stage5-lab}
        annotations:
          summary: Isolated AI-chat document backlog contract is active
          description: Stage 5.3 authenticated contract state; never a production health signal.

      - alert: AiChatSearchUnavailable
        expr: aichat_stage5_fault_active{service_name="ai-chat-stage5-lab",fault="search-unavailable"} == 1
        for: 15s
        labels: {severity: warning, service_name: ai-chat-stage5-lab}
        annotations:
          summary: Isolated AI-chat search unavailable contract is active
          description: Stage 5.3 authenticated contract state; never a production health signal.
