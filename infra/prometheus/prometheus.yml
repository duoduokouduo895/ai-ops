global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: cloud-demo

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: aidiag
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [aidiag-backend:8080]
        labels:
          service_name: aidiag

  - job_name: ai-chat-candidate
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ai-chat-candidate:9091]
        labels:
          service_name: ai-chat-candidate

  - job_name: ai-chat-stage5-lab
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ai-chat-stage5-lab:8080]
        labels:
          service_name: ai-chat-stage5-lab

  - job_name: faultlab-order
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [order-service:8080]
        labels:
          service_name: order-service

  - job_name: faultlab-payment
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [payment-service:8080]
        labels:
          service_name: payment-service

  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
