name: aidiag

services:
  postgres:
    image: ${POSTGRES_IMAGE:?Load versions.env before running Compose}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AIDIAG_DB_NAME}
      POSTGRES_USER: ${AIDIAG_DB_USERNAME}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - core
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIDIAG_DB_USERNAME} -d ${AIDIAG_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

  aidiag-backend:
    image: aidiag-backend:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AIDIAG_DB_URL: jdbc:postgresql://postgres:5432/${AIDIAG_DB_NAME}
      AIDIAG_DB_USERNAME: ${AIDIAG_DB_USERNAME}
      AIDIAG_DB_POOL_MAX: 8
      AIDIAG_DB_POOL_MIN: 2
      AIDIAG_LOG_FILE: /var/log/aidiag/aidiag.log
      AIDIAG_OPENAPI_ENABLED: "false"
      AIDIAG_SMOKE_ENABLED: ${AIDIAG_SMOKE_ENABLED:-false}
      AIDIAG_ALERT_WEBHOOK_USERNAME: ${ALERTMANAGER_WEBHOOK_USERNAME}
      AIDIAG_READ_API_USERNAME: ${AIDIAG_READ_API_USERNAME:-aidiag-reader}
      AIDIAG_WORKER_ENABLED: ${AIDIAG_WORKER_ENABLED:-true}
      AIDIAG_WORKER_POLL_DELAY_MS: ${AIDIAG_WORKER_POLL_DELAY_MS:-1000}
      AIDIAG_WORKER_LEASE_SECONDS: ${AIDIAG_WORKER_LEASE_SECONDS:-30}
      AIDIAG_WORKER_HEARTBEAT_SECONDS: ${AIDIAG_WORKER_HEARTBEAT_SECONDS:-5}
      AIDIAG_WORKER_PROCESSING_DELAY_MS: ${AIDIAG_WORKER_PROCESSING_DELAY_MS:-0}
      AIDIAG_WORKER_MAX_ATTEMPTS: ${AIDIAG_WORKER_MAX_ATTEMPTS:-3}
      AIDIAG_WORKER_RETRY_BACKOFF_SECONDS: ${AIDIAG_WORKER_RETRY_BACKOFF_SECONDS:-5}
      AIDIAG_STAGE3_ENABLED: ${AIDIAG_STAGE3_ENABLED:-false}
      AIDIAG_STAGE3_POLL_DELAY_MS: ${AIDIAG_STAGE3_POLL_DELAY_MS:-1000}
      AIDIAG_STAGE3_LEASE_SECONDS: ${AIDIAG_STAGE3_LEASE_SECONDS:-30}
      AIDIAG_STAGE3_INITIAL_DELAY_SECONDS: ${AIDIAG_STAGE3_INITIAL_DELAY_SECONDS:-30}
      AIDIAG_STAGE3_TOOL_TIMEOUT_SECONDS: ${AIDIAG_STAGE3_TOOL_TIMEOUT_SECONDS:-8}
      # Stage 4 stays off in the base stack. compose.stage4.yaml adds the
      # reviewed DeepSeek provider and its two file-mounted secrets.
      AIDIAG_STAGE4_ENABLED: ${AIDIAG_STAGE4_ENABLED:-false}
      AIDIAG_STAGE4_CHAT_MODEL: ${AIDIAG_STAGE4_CHAT_MODEL:-none}
      AIDIAG_STAGE4_PROMPT_VERSION: ${AIDIAG_STAGE4_PROMPT_VERSION:-stage4-v1}
      AIDIAG_STAGE4_MAX_EVIDENCE: ${AIDIAG_STAGE4_MAX_EVIDENCE:-12}
      AIDIAG_STAGE4_TIMEOUT_SECONDS: ${AIDIAG_STAGE4_TIMEOUT_SECONDS:-12}
      AIDIAG_STAGE4_DAILY_REQUEST_LIMIT: ${AIDIAG_STAGE4_DAILY_REQUEST_LIMIT:-20}
      AIDIAG_STAGE4_MAX_PROMPT_CHARS: ${AIDIAG_STAGE4_MAX_PROMPT_CHARS:-16000}
      AIDIAG_STAGE4_MAX_OUTPUT_TOKENS: ${AIDIAG_STAGE4_MAX_OUTPUT_TOKENS:-1200}
      AIDIAG_STAGE4_RETENTION_DAYS: ${AIDIAG_STAGE4_RETENTION_DAYS:-30}
      AIDIAG_STAGE4_OPERATOR_USERNAME: ${AIDIAG_STAGE4_OPERATOR_USERNAME:-aidiag-operator}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT}
      OTEL_RESOURCE_ATTRIBUTES: service.version=1.0.0,deployment.environment.name=${DEPLOYMENT_ENVIRONMENT},service.namespace=dduo
    secrets:
      - source: aidiag_db_password
        target: aidiag.db.password
      - source: aidiag_alertmanager_webhook_password
        target: aidiag.alerts.webhook.password
      - source: aidiag_read_api_secret
        target: aidiag.read-api.secret
    volumes:
      - aidiag_logs:/var/log/aidiag
    ports:
      - "${AIDIAG_PUBLIC_BIND:-127.0.0.1}:${AIDIAG_PUBLIC_PORT:-18080}:8080"
    networks:
      - core
      - telemetry
      - egress
    depends_on:
      postgres:
        condition: service_healthy
      alloy:
        condition: service_started
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true

  blackbox-exporter:
    image: ${BLACKBOX_EXPORTER_IMAGE:?Load versions.env before running Compose}
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
    volumes:
      - ./infra/blackbox/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    expose:
      - "9115"
    networks:
      - telemetry
      - middleware
      - nacos
      - egress
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true

  aidiag-integration-test:
    image: maven:3.9.16-eclipse-temurin-21@sha256:0bef3f122ac7c0928b2fbcdf444f98cbd2db0ef7a1193bfa121cd70fa22221ef
    profiles: ["test"]
    working_dir: /workspace
    command:
      - sh
      - -ec
      - cp -a /source/. /workspace/ && mvn -B -ntp -Djansi.force=false -Dtest=Stage2PostgresIntegrationTests test
    environment:
      AIDIAG_INTEGRATION_TESTS: "true"
      AIDIAG_DB_URL: jdbc:postgresql://postgres:5432/${AIDIAG_DB_NAME}
      AIDIAG_DB_USERNAME: ${AIDIAG_DB_USERNAME}
      AIDIAG_ALERT_WEBHOOK_PASSWORD: integration-test-password
      AIDIAG_WORKER_ENABLED: "false"
      AIDIAG_STAGE3_ENABLED: "false"
      AIDIAG_OPENAPI_ENABLED: "false"
    secrets:
      - source: aidiag_db_password
        target: aidiag.db.password
    volumes:
      - ./:/source:ro
    networks:
      - core
      - egress
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /root/.m2:size=512m,mode=0700
      - /workspace:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true

  faultlab-postgres:
    image: ${POSTGRES_IMAGE:?Load versions.env before running Compose}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FAULTLAB_DB_NAME}
      POSTGRES_USER: ${FAULTLAB_DB_USERNAME}
      POSTGRES_PASSWORD_FILE: /run/secrets/faultlab_db_password
    secrets:
      - faultlab_db_password
    volumes:
      - faultlab_postgres_data:/var/lib/postgresql
    networks:
      - faultlab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FAULTLAB_DB_USERNAME} -d ${FAULTLAB_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

  order-service:
    image: aidiag-faultlab:0.1.0
    build:
      context: ./fault-lab
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      FAULTLAB_ROLE: order
      FAULTLAB_SERVICE_NAME: order-service
      FAULTLAB_DB_URL: jdbc:postgresql://faultlab-postgres:5432/${FAULTLAB_DB_NAME}
      FAULTLAB_DB_USERNAME: ${FAULTLAB_DB_USERNAME}
      FAULTLAB_FLYWAY_ENABLED: "false"
      FAULTLAB_HIKARI_MAX: ${FAULTLAB_HIKARI_MAX:-4}
      FAULTLAB_HIKARI_CONNECTION_TIMEOUT_MS: ${FAULTLAB_HIKARI_CONNECTION_TIMEOUT_MS:-500}
      FAULTLAB_PAYMENT_URL: http://payment-service:8080
      FAULTLAB_ORDER_REQUEST_TIMEOUT_MS: ${FAULTLAB_ORDER_REQUEST_TIMEOUT_MS:-1000}
      FAULTLAB_LOG_FILE: /var/log/faultlab/order-service.log
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT}
      OTEL_SERVICE_NAME: order-service
      OTEL_RESOURCE_ATTRIBUTES: service.version=0.1.0,deployment.environment.name=${DEPLOYMENT_ENVIRONMENT},service.namespace=dduo
    secrets:
      - source: faultlab_db_password
        target: faultlab.db.password
    volumes:
      - faultlab_logs:/var/log/faultlab
    ports:
      - "${FAULTLAB_ORDER_PUBLIC_BIND:-127.0.0.1}:${FAULTLAB_ORDER_PUBLIC_PORT:-18081}:8080"
    networks:
      - faultlab
      - telemetry
      - edge
    depends_on:
      faultlab-postgres:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      alloy:
        condition: service_started
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=96m,mode=1777
    security_opt:
      - no-new-privileges:true

  payment-service:
    image: aidiag-faultlab:0.1.0
    build:
      context: ./fault-lab
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      FAULTLAB_ROLE: payment
      FAULTLAB_SERVICE_NAME: payment-service
      FAULTLAB_CONTROLS_ENABLED: "true"
      FAULTLAB_DB_URL: jdbc:postgresql://faultlab-postgres:5432/${FAULTLAB_DB_NAME}
      FAULTLAB_DB_USERNAME: ${FAULTLAB_DB_USERNAME}
      FAULTLAB_FLYWAY_ENABLED: "true"
      FAULTLAB_HIKARI_MAX: ${FAULTLAB_HIKARI_MAX:-4}
      FAULTLAB_HIKARI_CONNECTION_TIMEOUT_MS: ${FAULTLAB_HIKARI_CONNECTION_TIMEOUT_MS:-500}
      FAULTLAB_DOWNSTREAM_DELAY_MS: ${FAULTLAB_DOWNSTREAM_DELAY_MS:-3000}
      FAULTLAB_LOG_FILE: /var/log/faultlab/payment-service.log
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT}
      OTEL_SERVICE_NAME: payment-service
      OTEL_RESOURCE_ATTRIBUTES: service.version=0.1.0,deployment.environment.name=${DEPLOYMENT_ENVIRONMENT},service.namespace=dduo
    secrets:
      - source: faultlab_db_password
        target: faultlab.db.password
      - source: faultlab_control_token
        target: faultlab.control.token
    volumes:
      - faultlab_logs:/var/log/faultlab
    networks:
      - faultlab
      - telemetry
    depends_on:
      faultlab-postgres:
        condition: service_healthy
      alloy:
        condition: service_started
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=96m,mode=1777
    security_opt:
      - no-new-privileges:true

  ai-chat-stage5-lab:
    profiles: ["stage5-test"]
    image: aidiag-faultlab:0.1.0
    build:
      context: ./fault-lab
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: stage5-test
      FAULTLAB_ROLE: ai-chat-stage5
      FAULTLAB_SERVICE_NAME: ai-chat-stage5-lab
      FAULTLAB_CONTROLS_ENABLED: "true"
      FAULTLAB_DB_URL: jdbc:postgresql://faultlab-postgres:5432/${FAULTLAB_DB_NAME}
      FAULTLAB_DB_USERNAME: ${FAULTLAB_DB_USERNAME}
      FAULTLAB_FLYWAY_ENABLED: "false"
      FAULTLAB_LOG_FILE: /var/log/faultlab/ai-chat-stage5-lab.log
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT}
      OTEL_SERVICE_NAME: ai-chat-stage5-lab
      OTEL_RESOURCE_ATTRIBUTES: service.version=0.1.0,deployment.environment.name=${DEPLOYMENT_ENVIRONMENT},service.namespace=dduo,aidiag.test.profile=stage5
    secrets:
      - source: faultlab_db_password
        target: faultlab.db.password
      - source: aichat_stage5_fault_token
        target: aichat.stage5.fault.token
    volumes:
      - faultlab_logs:/var/log/faultlab
    networks:
      - faultlab
      - telemetry
    depends_on:
      faultlab-postgres:
        condition: service_healthy
      alloy:
        condition: service_started
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=96m,mode=1777
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: ${PROMETHEUS_IMAGE:?Load versions.env before running Compose}
    restart: unless-stopped
    # Optional Ai-chat /actuator/prometheus Basic Auth (empty = network-trust scrape).
    # Flip together with Ai-chat app.security.actuator.prometheus-auth-enabled=true.
    environment:
      AI_CHAT_PROMETHEUS_USERNAME: ${AI_CHAT_PROMETHEUS_USERNAME:-}
      AI_CHAT_PROMETHEUS_PASSWORD: ${AI_CHAT_PROMETHEUS_PASSWORD:-}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - ${AIDIAG_PROMETHEUS_TARGETS_DIR:-./.runtime/prometheus-targets}:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    networks:
      - core
      - telemetry
    depends_on:
      - alertmanager
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:?Load versions.env before running Compose}
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    secrets:
      - alertmanager_webhook_password
    volumes:
      - ${AIDIAG_ALERTMANAGER_CONFIG:-./infra/alertmanager/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - core
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

  alloy:
    image: ${ALLOY_IMAGE:?Load versions.env before running Compose}
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT}
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy
      - aidiag_logs:/var/log/aidiag:ro
      - faultlab_logs:/var/log/faultlab:ro
      - /opt/ai-chat/logs:/var/log/ai-chat:ro
    networks:
      - telemetry
    depends_on:
      - loki
      - tempo
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  loki:
    image: ${LOKI_IMAGE:?Load versions.env before running Compose}
    restart: unless-stopped
    # Named volumes are root-owned on first creation; Loki must initialize its
    # filesystem-backed rule directory before it can drop into normal operation.
    user: "0:0"
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/var/loki
    networks:
      - telemetry
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  tempo:
    image: ${TEMPO_IMAGE:?Load versions.env before running Compose}
    restart: unless-stopped
    command:
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    networks:
      - telemetry
    mem_limit: 640m
    cpus: 0.75
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

  grafana:
    image: ${GRAFANA_IMAGE:?Load versions.env before running Compose}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:13000}
      # This installation only uses Grafana's bundled core panels and the
      # provisioned Prometheus/Loki/Tempo data sources. Disable suggested
      # plugin background installs so a hardened container never tries to
      # mutate its image filesystem at startup.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PUBLIC_BIND:-127.0.0.1}:${GRAFANA_PUBLIC_PORT:-13000}:3000"
    networks:
      - core
      - telemetry
      - edge
    depends_on:
      - prometheus
      - loki
      - tempo
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1536m
    cpus: 0.50
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

networks:
  core:
    name: aidiag-core
    internal: true
  telemetry:
    name: aidiag-telemetry
    internal: true
  egress:
    name: aidiag-egress
  edge:
    name: aidiag-edge
  faultlab:
    name: aidiag-faultlab
    internal: true
  middleware:
    external: true
    name: middleware-net
  nacos:
    external: true
    name: nacos-net

volumes:
  postgres_data:
  prometheus_data:
  alertmanager_data:
  alloy_data:
  loki_data:
  tempo_data:
  grafana_data:
  aidiag_logs:
  faultlab_postgres_data:
  faultlab_logs:

secrets:
  postgres_password:
    file: ${AIDIAG_SECRETS_DIR:-./.secrets}/postgres_password
  aidiag_db_password:
    file: ${AIDIAG_SECRETS_DIR:-./.secrets}/postgres_password
  alertmanager_webhook_password:
    file: ${AIDIAG_SECRETS_DIR:-./.secrets}/alertmanager_webhook_password
  aidiag_alertmanager_webhook_password:
    file: ${AIDIAG_SECRETS_DIR:-./.secrets}/aidiag_alertmanager_webhook_password
  aidiag_read_api_secret:
    file: ${AIDIAG_SECRETS_DIR:-./.secrets}/aidiag_read_api_secret
  grafana_admin_password:
    file: ${AIDIAG_SECRETS_DIR:-./.secrets}/grafana_admin_password
  faultlab_db_password:
    file: ${AIDIAG_SECRETS_DIR:-./.secrets}/faultlab_db_password
  faultlab_control_token:
    file: ${AIDIAG_SECRETS_DIR:-./.secrets}/faultlab_control_token
  aichat_stage5_fault_token:
    file: ${AIDIAG_SECRETS_DIR:-./.secrets}/aichat_stage5_fault_token
