groups:
  - name: homeops-host
    rules:
      - alert: HomeServerMetricsUnavailable
        expr: up{job="home-node"} == 0
        for: 2m
        labels: {severity: critical, service_name: home-server, alert_scope: homeops}
        annotations:
          summary: 家庭服务器主机指标不可达
          description: Prometheus 已连续两分钟无法抓取主机采集器；这能证明采集链路中断，但不能单独区分主机断电、Docker 故障或网络故障。

      - alert: HomeServerCollectorStale
        expr: time() - homeops_collector_last_success_timestamp_seconds > 90
        for: 2m
        labels: {severity: warning, service_name: home-server, alert_scope: homeops}
        annotations:
          summary: 家庭服务器电源与温度采集已过期
          description: 自定义主机采集文件超过 90 秒没有刷新，请检查 homeops-power-collector。

      - alert: HomeServerPowerDataMissing
        expr: absent(homeops_ac_online) and on() (up{job="home-node"} == 1)
        for: 3m
        labels: {severity: warning, service_name: home-server, alert_scope: homeops}
        annotations:
          summary: 家庭服务器供电数据缺失
          description: 主机采集器在线，但交流供电指标连续三分钟缺失，请检查 power_supply sysfs 挂载与采集日志。

      - alert: HomeServerHighCpu
        expr: 100 * (1 - avg(rate(node_cpu_seconds_total{job="home-node",mode="idle"}[5m]))) > 90
        for: 10m
        labels: {severity: warning, service_name: home-server, alert_scope: homeops}
        annotations:
          summary: 家庭服务器 CPU 持续繁忙
          description: 五分钟 CPU 使用率持续十分钟高于 90%，请结合容器指标与近期任务判断负载来源。

      - alert: HomeServerMemoryPressure
        expr: node_memory_MemAvailable_bytes{job="home-node"} / node_memory_MemTotal_bytes{job="home-node"} < 0.10
        for: 10m
        labels: {severity: warning, service_name: home-server, alert_scope: homeops}
        annotations:
          summary: 家庭服务器可用内存不足
          description: 可用内存持续十分钟低于 10%，应先检查容器内存上限和 OOM 记录，不要直接整体放宽限制。

      - alert: HomeServerRootDiskLow
        expr: node_filesystem_avail_bytes{job="home-node",mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{job="home-node",mountpoint="/",fstype!~"tmpfs|overlay"} < 0.15
        for: 15m
        labels: {severity: warning, service_name: home-server, alert_scope: homeops}
        annotations:
          summary: 家庭服务器根磁盘剩余空间不足
          description: 根文件系统可用空间持续十五分钟低于 15%，请优先检查日志、镜像和备份保留量。

      - alert: HomeServerCpuHot
        expr: homeops_temperature_celsius{sensor="cpu"} > 85
        for: 5m
        labels: {severity: warning, service_name: home-server, alert_scope: homeops}
        annotations:
          summary: 家庭服务器 CPU 温度偏高
          description: CPU 温度连续五分钟高于 85°C，请检查风道、风扇和异常负载。

      - alert: HomeServerNvmeHot
        expr: homeops_temperature_celsius{sensor="nvme"} > 70
        for: 5m
        labels: {severity: warning, service_name: home-server, alert_scope: homeops}
        annotations:
          summary: 家庭服务器 NVMe 温度偏高
          description: NVMe 温度连续五分钟高于 70°C，请检查散热和持续写入任务。

      - alert: HomeServerRunningOnBattery
        expr: homeops_ac_online == 0
        for: 3m
        labels: {severity: critical, service_name: home-server, alert_scope: homeops}
        annotations:
          summary: 家庭服务器已切换到电池供电
          description: 交流电已连续三分钟断开；笔记本电池是短时 UPS，不应作为长期供电来源。

      - alert: HomeServerCoreUnitDown
        expr: max by (name) (node_systemd_unit_state{job="home-node",name=~"(docker|frpc|cloudflared)\\.service",state="active"}) == 0
        for: 2m
        labels: {severity: critical, service_name: home-server, alert_scope: homeops}
        annotations:
          summary: "家庭服务器核心服务 {{ $labels.name }} 未运行"
          description: systemd 报告核心宿主机服务不处于 active 状态，请先查看该 unit 的状态与日志。
