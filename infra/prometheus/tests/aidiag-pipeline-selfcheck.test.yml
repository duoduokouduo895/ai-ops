rule_files:
  - ../rules/aidiag-pipeline.yml
evaluation_interval: 15s
tests:
  - name: continuous-database-down-fires-self-check-failed
    interval: 15s
    input_series:
      - series: 'aidiag_database_reachable'
        values: '0+0x16'
    alert_rule_test:
      - eval_time: 1m
        alertname: AIDiagPipelineSelfCheckFailed
        exp_alerts: []
      - eval_time: 3m
        alertname: AIDiagPipelineSelfCheckFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              service_name: aidiag
            exp_annotations:
              summary: AIDiag pipeline self-check cannot read the database
              description: The bounded self-check failed. Pending-run gauges must be treated as unknown, not zero.

  - name: expired-unknown-does-not-satisfy-database-down
    interval: 15s
    input_series:
      - series: 'aidiag_database_reachable'
        values: '0 0 0 0 NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
    alert_rule_test:
      - eval_time: 3m
        alertname: AIDiagPipelineSelfCheckFailed
        exp_alerts: []
