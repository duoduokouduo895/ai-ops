# Use instead of compose.console.yaml; this mode mounts no console password secrets.
services:
  aidiag-backend:
    image: ${AIDIAG_IMAGE:?Set the reviewed Access-capable AIDiag image}
    environment:
      OTEL_RESOURCE_ATTRIBUTES: service.version=${AIDIAG_RELEASE_VERSION:-access},deployment.environment.name=${DEPLOYMENT_ENVIRONMENT},service.namespace=dduo
      AIDIAG_CONSOLE_ENABLED: "true"
      AIDIAG_CONSOLE_AUTH_MODE: access
      AIDIAG_CONSOLE_ACCESS_TEAM_DOMAIN: ${AIDIAG_CONSOLE_ACCESS_TEAM_DOMAIN:?Set the Cloudflare Access team domain}
      AIDIAG_CONSOLE_ACCESS_AUDIENCE: ${AIDIAG_CONSOLE_ACCESS_AUDIENCE:?Set the console Access application AUD}
      AIDIAG_CONSOLE_ALLOWED_ORIGIN: https://ops.dduo.me
      AIDIAG_RECONCILIATION_ENABLED: ${AIDIAG_RECONCILIATION_ENABLED:-true}
      AIDIAG_RECONCILIATION_APPLY_TRANSITIONS: ${AIDIAG_RECONCILIATION_APPLY_TRANSITIONS:-false}
      AIDIAG_RECONCILIATION_REQUIRED_OBSERVATIONS: ${AIDIAG_RECONCILIATION_REQUIRED_OBSERVATIONS:-3}
      AIDIAG_RECONCILIATION_GRACE_MINUTES: ${AIDIAG_RECONCILIATION_GRACE_MINUTES:-10}
      AIDIAG_RECONCILIATION_MAX_DIAGNOSIS_ATTEMPTS: ${AIDIAG_RECONCILIATION_MAX_DIAGNOSIS_ATTEMPTS:-3}
